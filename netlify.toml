[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"


[[redirects]]
  from = "/giveaway"
  to = "/?giveaway=1"
  status = 302

[[redirects]]
  # MLB postseason offer (Oct 2026): the monthly Pro checkout with the WORLDSERIES code prefilled.
  # Stripe (set up Oct 13): coupon "World Series: Pro $5/month for 3 months" ($3 off, repeating 3 months), promotion
  # code WORLDSERIES expiring Nov 1, 2026 11:59 PM ET; the monthly Payment Link already allows promotion codes.
  from = "/worldseries"
  to = "https://buy.stripe.com/bJeeV65z565XgzTcpC3wQ02?prefilled_promo_code=WORLDSERIES"
  status = 302

[[redirects]]
  from = "/giveaway-rules"
  to = "/giveaway-rules.html"
  status = 200

[[headers]]
  for = "/social/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
