[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"


[[redirects]]
  from = "/giveaway"
  to = "/?giveaway=1"
  status = 302

[[redirects]]
  # MLB postseason offer (Oct 2026): the monthly Pro checkout with the WORLDSERIES code prefilled.
  # Needs "Allow promotion codes" on the monthly Payment Link in Stripe and a promotion code WORLDSERIES ($3 off).
  from = "/worldseries"
  to = "https://buy.stripe.com/bJeeV65z565XgzTcpC3wQ02?prefilled_promo_code=WORLDSERIES"
  status = 302

[[redirects]]
  from = "/giveaway-rules"
  to = "/giveaway-rules.html"
  status = 200

[[headers]]
  for = "/social/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
